<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kendaraan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    .card {
      background-color: #334155;
      padding: 1.5rem;
      border-radius: 0.75rem;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-title {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .unit {
      font-size: 1rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="dashboard-header">
      <h2>Dashboard Kendaraan</h2>
    </div>

    <div class="metrics-grid">
      <div class="card">
        <div class="card-title">Kecepatan</div>
        <div class="card-value">60 <span class="unit">km/jam</span></div>
      </div>

      <div class="card">
        <div class="card-title">Odometer</div>
        <div class="card-value">12.450 <span class="unit">km</span></div>
      </div>
    </div>
  </div>

</body>
</html>
