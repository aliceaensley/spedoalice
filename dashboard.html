<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Dashboard - Status Kendaraan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h2, h3 {
            color: #ff69b4;
            margin-bottom: 15px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Form Tambah Kendaraan Simple */
        .add-vehicle-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: #ccc;
        }

        .form-group input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff69b4;
        }

        .btn-add {
            background: #ff69b4;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #ff85c1;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        /* Styling Tabel Kendaraan */
        .vehicle-table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .vehicle-table th {
            background-color: #ff69b4;
            color: #000000;
            text-align: left;
            padding: 12px 15px;
            font-size: 14px;
        }

        .vehicle-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #333333;
            font-size: 13px;
        }

        .vehicle-table tr:hover {
            background-color: #2a2a2a;
        }

        /* Badge VID & Plat */
        .badge-vid {
            color: #ff69b4;
            background: rgba(255, 105, 180, 0.15);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #ff69b4;
            font-weight: bold;
        }

        .badge-plate {
            color: #000;
            background: #f1c40f;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Progress Bar Bensin & Mesin */
        .progress-bar-bg {
            width: 100%;
            background-color: #333;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .fill-health { background-color: #2ecc71; }
        .fill-fuel { background-color: #3498db; }
        .fill-warning { background-color: #e74c3c; }
