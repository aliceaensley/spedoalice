<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kendaraan HUD</title>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/all.css">
    <!-- Panggil CSS khusus dashboard di sini -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="container">
    <!-- FORM INPUT / EDIT -->
    <div class="card">
        <h2 id="formTitle"><i class="fa-solid fa-truck-front"></i> Tambah Kendaraan Baru</h2>
        
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-grid">
            <div class="form-group">
                <label>Nama Kendaraan</label>
                <input type="text" id="vehicleName" placeholder="Contoh: DAF XF 105">
            </div>
            <div class="form-group">
                <label>VID (Vehicle ID)</label>
                <input type="text" id="vehicleID" placeholder="Contoh: TRK-001">
            </div>
            <div class="form-group">
                <label>Plat Nomor</label>
                <input type="text" id="vehiclePlate" placeholder="Contoh: B 1234 ABC">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-add" id="btnSave" onclick="saveVehicle()"><i class="fa-solid fa-plus"></i> Simpan Kendaraan</button>
            <button class="btn-cancel" id="btnCancel" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Batal</button>
        </div>
    </div>

    <!-- LIST KENDARAAN -->
    <div class="card">
        <h2><i class="fa-solid fa-list"></i> Daftar Kendaraan Terdaftar</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Nama Kendaraan</th>
                    <th>VID</th>
                    <th>Plat Nomor</th>
                    <th style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="vehicleTableBody">
            </tbody>
        </table>

        <div class="link-output" id="linkBox">
            <strong>Link HUD Game:</strong>
            <p id="generatedUrl" style="color: #2ecc71; margin-top: 5px;"></p>
        </div>
    </div>
</div>

<script>
    let vehicles = JSON.parse(localStorage.getItem('hud_vehicles')) || [];

    function renderTable() {
        const tbody = document.getElementById('vehicleTableBody');
        tbody.innerHTML = '';

        if (vehicles.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666;">Belum ada kendaraan yang ditambahkan.</td></tr>`;
            return;
        }

        vehicles.forEach((v, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${v.name}</strong></td>
                <td><code>${v.vid}</code></td>
                <td><span class="plate-badge">${v.plate}</span></td>
                <td style="text-align: center;">
                    <div style="display: flex; gap: 5px; justify-content: center;">
                        <button class="action-btn btn-link" onclick="getHUDLink(${index})" title="Ambil Link HUD"><i class="fa-solid fa-link"></i> Link</button>
                        <button class="action-btn btn-edit" onclick="editVehicle(${index})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteVehicle(${index})" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveVehicle() {
        const name = document.getElementById('vehicleName').value.trim();
        const vid = document.getElementById('vehicleID').value.trim();
        const plate = document.getElementById('vehiclePlate').value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);

        if (!name || !vid || !plate) {
            alert('Semua kolom wajib diisi!');
            return;
        }

        const vehicleData = { name, vid, plate };

        if (editIndex === -1) {
            vehicles.push(vehicleData);
        } else {
            vehicles[editIndex] = vehicleData;
        }

        localStorage.setItem('hud_vehicles', JSON.stringify(vehicles));
        resetForm();
        renderTable();
    }

    function editVehicle(index) {
        const v = vehicles[index];
        document.getElementById('vehicleName').value = v.name;
        document.getElementById('vehicleID').value = v.vid;
        document.getElementById('vehiclePlate').value = v.plate;
        document.getElementById('editIndex').value = index;

        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Kendaraan';
        document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-check"></i> Update Kendaraan';
        document.getElementById('btnCancel').style.display = 'inline-flex';
    }

    function deleteVehicle(index) {
        if (confirm('Yakin ingin menghapus kendaraan ini?')) {
            vehicles.splice(index, 1);
            localStorage.setItem('hud_vehicles', JSON.stringify(vehicles));
            renderTable();
            document.getElementById('linkBox').style.display = 'none';
        }
    }

    function resetForm() {
        document.getElementById('vehicleName').value = '';
        document.getElementById('vehicleID').value = '';
        document.getElementById('vehiclePlate').value = '';
        document.getElementById('editIndex').value = '-1';

        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-truck-front"></i> Tambah Kendaraan Baru';
        document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-plus"></i> Simpan Kendaraan';
        document.getElementById('btnCancel').style.display = 'none';
    }

    function getHUDLink(index) {
        const v = vehicles[index];
        const baseUrl = window.location.href.replace('dashboard.html', 'index.html');
        const fullUrl = `${baseUrl}?name=${encodeURIComponent(v.name)}&vid=${encodeURIComponent(v.vid)}&plate=${encodeURIComponent(v.plate)}`;
        
        document.getElementById('linkBox').style.display = 'block';
        document.getElementById('generatedUrl').innerText = fullUrl;
    }

    renderTable();
</script>

</body>
</html>
