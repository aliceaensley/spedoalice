<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendaraan Alice</title>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- File CSS Utama -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hud-container">
        <!-- BARISAN UTAMA (KAPSUL ATAS) -->
        <div class="top-capsule-bar">
            <!-- Kiri Top Bar (Nama Mobil & Odometer) -->
            <div class="top-left-group">
                <div class="hud-item truck-slot">
                    <i class="fa-solid fa-truck"></i>
                    <span id="truck-model">-</span>
                    <span id="truck-vid" class="badge-vid">-</span>
                    <span id="truck-plate" class="badge-plate">-</span>
                </div>
                <div class="hud-item"><i class="fa-solid fa-road"></i> <span id="odometer">0 Miles</span></div>
            </div>

            <!-- KOTAK TENGAH TRANSPARAN -->
            <div class="center-speed-box"></div>

            <!-- Kanan Top Bar (Gear, Engine, Lampu, Sabuk) -->
            <div class="top-right-group">
                <div class="hud-item"><i class="fa-solid fa-gear"></i> Gear: <span id="gear">N</span></div>
                <div class="hud-item"><i class="fa-solid fa-power-off"></i> <span id="engine">Off</span></div>
                <div class="hud-item"><i class="fa-solid fa-lightbulb"></i> <span id="headlights">Off</span></div>
                <div class="hud-item"><i class="fa-solid fa-user-shield"></i> <span id="seatbelts">Off</span></div>
            </div>
        </div>

        <!-- BARISAN SUB BAR BAWAH -->
        <div class="bottom-bars-wrapper">
            <!-- Sub Bar Bawah Kiri (Kecepatan & Lampu Sen) -->
            <div class="sub-bar-left">
                <div class="hud-item"><i class="fa-solid fa-gauge-high"></i> <span id="speed">0 MPH</span></div>
                <div class="hud-item"><i class="fa-solid fa-arrows-left-right"></i> <span id="indicators">Off / Off</span></div>
            </div>

            <!-- Sub Bar Bawah Kanan (Pindahan Health & Fuel + RPM) -->
            <div class="sub-bar-right">
                <div class="hud-item"><i class="fa-solid fa-wrench"></i> <span id="health">0%/100%</span></div>
                <div class="hud-item"><i class="fa-solid fa-gas-pump"></i> <span id="fuel">0%/100%</span></div>
                <div class="hud-item rpm-item"><i class="fa-solid fa-tachograph-digital"></i> <span id="rpm">0 RPM</span></div>
            </div>
        </div>
    </div>

    <!-- SPEDO KEDUA (NEON CYAN SPEEDOMETER BAWAH KANAN) -->
    <div class="analog-speedo-container">
        <svg class="analog-gauge" viewBox="0 0 200 200">
            <!-- Ring Luar Cyan Neon Glow -->
            <circle cx="100" cy="100" r="92" class="gauge-neon-ring" />
            <circle cx="100" cy="100" r="88" class="gauge-bg" />
            
            <!-- Zona Redline Kecepatan Tinggi (180 - 240) -->
            <path d="M 100 100 L 162.2 37.8 A 88 88 0 0 1 144 176.2 Z" class="gauge-red-zone" />
            
            <!-- Striping Skala Garis-Garis -->
            <circle cx="100" cy="100" r="83" class="gauge-ticks" />
            
            <!-- Teks Satuan MPH -->
            <text x="100" y="75" class="gauge-unit-text">mph</text>

            <!-- Angka Skala Kecepatan (0 - 240 MPH) -->
            <text x="52" y="162" class="gauge-num">0</text>
            <text x="35" y="132" class="gauge-num">20</text>
            <text x="32" y="96" class="gauge-num">40</text>
            <text x="42" y="62" class="gauge-num">60</text>
            <text x="64" y="38" class="gauge-num">80</text>
            <text x="100" y="28" class="gauge-num">100</text>
            <text x="136" y="38" class="gauge-num">120</text>
            <text x="158" y="62" class="gauge-num">140</text>
            <text x="168" y="96" class="gauge-num">160</text>
            <text x="165" y="132" class="gauge-num gauge-num-red">180</text>
            <text x="148" y="162" class="gauge-num gauge-num-red">200</text>
            <text x="122" y="180" class="gauge-num gauge-num-red">220</text>
            <text x="90" y="186" class="gauge-num gauge-num-red">240</text>

            <!-- Jarum Merah Neon -->
            <line id="analog-needle" x1="100" y1="100" x2="30" y2="150" class="gauge-needle" />
            
            <!-- Tutup Tengah Jarum -->
            <circle cx="100" cy="100" r="11" class="gauge-center-cap-outer" />
            <circle cx="100" cy="100" r="9" class="gauge-center-cap-inner" />
        </svg>

        <!-- Display Digital Tambahan di Tengah -->
        <div class="analog-display">
            <div class="gear-box" id="analog-gear">1</div>
            <div class="speed-box" id="analog-speed">0</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
