<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS2 HUD</title>
    <!-- Icon FontAwesome -->
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/all.css">
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
    <div class="hud-container">
        <!-- BARISAN UTAMA (KAPSUL ATAS) -->
        <div class="top-capsule-bar">
            <!-- Kiri Top Bar (4 Item) -->
            <div class="top-left-group">
                <div class="hud-item truck-slot">
                    <i class="fa-solid fa-truck"></i>
                    <span id="truck-model"></span>
                </div>
                <div class="hud-item"><i class="fa-solid fa-road"></i> <span id="odometer">0 Miles</span></div>
                <div class="hud-item"><i class="fa-solid fa-wrench"></i> <span id="health">0%/100%</span></div>
                <div class="hud-item"><i class="fa-solid fa-gas-pump"></i> <span id="fuel">0%/100%</span></div>
            </div>

            <!-- KOTAK TENGAH TRANSPARAN -->
            <div class="center-speed-box"></div>

            <!-- Kanan Top Bar (4 Item) -->
            <div class="top-right-group">
                <div class="hud-item"><i class="fa-solid fa-gear"></i> Gear: <span id="gear">N</span></div>
                <div class="hud-item"><i class="fa-solid fa-power-off"></i> <span id="engine">Off</span></div>
                <div class="hud-item"><i class="fa-solid fa-lightbulb"></i> <span id="headlights">Off</span></div>
                <div class="hud-item"><i class="fa-solid fa-user-shield"></i> <span id="seatbelts">Off</span></div>
            </div>
        </div>

        <!-- BARISAN SUB BAR BAWAH -->
        <div class="bottom-bars-wrapper">
            <!-- Sub Bar Bawah Kiri -->
            <div class="sub-bar-left">
                <div class="hud-item"><i class="fa-solid fa-gauge-high"></i> <span id="speed">0 MPH</span></div>
                <div class="hud-item"><i class="fa-solid fa-arrows-left-right"></i> <span id="indicators">Off / Off</span></div>
            </div>

            <!-- Sub Bar Bawah Kanan -->
            <div class="sub-bar-right">
                <div class="hud-item rpm-item"><i class="fa-solid fa-tachograph-digital"></i> <span id="rpm">0 RPM</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
