<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS2 Style Speedometer</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hud-container">
        <!-- Barisan Atas (Atas/Top Bar) -->
        <div class="top-bar">
            <div class="hud-item"><i class="fa-solid fa-truck"></i> <span id="truck-model">DAF XF</span></div>
            <div class="hud-item"><i class="fa-solid fa-road"></i> <span id="odometer">0 KM</span></div>
            <div class="hud-item"><i class="fa-solid fa-wrench"></i> <span id="health">0%</span></div>
            <div class="hud-item"><i class="fa-solid fa-gas-pump"></i> <span id="fuel">0%</span></div>
            <div class="hud-item"><i class="fa-solid fa-power-off"></i> <span id="engine">Off</span></div>
        </div>

        <!-- Barisan Bawah / Info Tambahan -->
        <div class="sub-bar">
            <div class="hud-sub-item"><i class="fa-solid fa-lightbulb"></i> Lampu: <span id="headlights">Off</span></div>
            <div class="hud-sub-item"><i class="fa-solid fa-arrows-left-right"></i> Sein: <span id="indicators">Off / Off</span></div>
            <div class="hud-sub-item"><i class="fa-solid fa-user-slash"></i> Sabuk: <span id="seatbelts">Off</span></div>
        </div>

        <!-- Kotak Tengah (Kecepatan & Gigi) -->
        <div class="speed-box">
            <div class="gear-icon"><i class="fa-solid fa-gear"></i></div>
            <div class="speed-display">
                <span id="speed" class="speed-value">0 KMH</span>
            </div>
            <div class="gear-and-rpm">
                <span class="gear-label">Gear: <strong id="gear">N</strong></span>
                <span class="rpm-label"><i class="fa-solid fa-gauge"></i> <span id="rpm">0 RPM</span></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
