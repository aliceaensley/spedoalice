<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS2 Style Speedometer</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hud-wrapper">
        <div class="top-capsule-bar">
            <!-- Sisi Kiri (Hitam Transparan) -->
            <div class="left-section">
                <div class="hud-item"><i class="fa-solid fa-power-off"></i> Engine: <span id="engine">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-gauge-high"></i> <span id="speed">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-tachograph-digital"></i> <span id="rpm">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-gas-pump"></i> <span id="fuel">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-heart-pulse"></i> <span id="health">&nbsp;</span></div>
            </div>

            <!-- KOTAK TENGAH (Murni Transparan dengan Bingkai/Outline) -->
            <div class="center-spacer-box"></div>

            <!-- Sisi Kanan (Hitam Transparan) -->
            <div class="right-section">
                <div class="hud-item"><i class="fa-solid fa-gear"></i> Gear: <span id="gear">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-lightbulb"></i> <span id="headlights">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-arrows-left-right"></i> <span id="indicators">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-user-shield"></i> <span id="seatbelts">&nbsp;</span></div>
                <div class="hud-item"><i class="fa-solid fa-road"></i> <span id="odometer">&nbsp;</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
